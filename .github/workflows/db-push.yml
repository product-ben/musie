# Walk merged migrations over to the hosted database, so a person does not have
# to remember to.
#
# ── THE PROBLEM ───────────────────────────────────────────────────────────────
# Migrations are append-only and are applied to the local stack and to
# `project-musie` separately. A branch that merges with new migrations leaves
# hosted behind until somebody runs `supabase db push`, and nothing notices:
# `pnpm check` never touches a database (CLAUDE.md rule 4), so every check stays
# green while the two disagree.
#
# ── THIS IS INERT UNTIL TWO SECRETS EXIST ────────────────────────────────────
# Settings → Secrets and variables → Actions:
#
#   SUPABASE_ACCESS_TOKEN   a personal access token, supabase.com/dashboard/account/tokens
#                           EXPIRES — the one created on 2026-10-13 runs out a
#                           year later. SCHEDULED-MAINTENANCE.md carries the date
#                           and what breaks: this job fails on `supabase link`,
#                           merged migrations stop reaching hosted, and the only
#                           loud signal is an email. `pnpm db:status` is the
#                           backstop that catches it anyway.
#   SUPABASE_DB_PASSWORD    the project's database password
#
# Without both the first step says so and every later step is skipped, so
# committing this changes nothing until that choice is made.
#
# TWO AND NOT FIVE. The anon and service-role keys are not stored here — the
# access token fetches them at run time. And the project ref is not a secret at
# all: it is in the `env` block below, in plain sight, because it is half of
# every public URL this project serves. Storing it as a secret would have
# implied otherwise and cost a third setup step.
#
# ── WHY AUTOMATIC IS DEFENSIBLE, AND HOW TO MAKE IT ONE CLICK INSTEAD ────────
# It runs only on `main`, so the change is already merged and reviewed; the
# asset check runs immediately after and fails the job loudly; and
# `supabase db push` only applies what a migration says — it invents no
# deletions.
#
# ── AND ONCE A DAY, WITHOUT THE PUSH ─────────────────────────────────────────
# Lucia changes tracks, pictures and cards at /maintenance, which merges
# nothing and so triggers nothing. The schedule runs only the last step — is
# every file an exercise uses there? — so a track uploaded wrong on a Tuesday
# is red by Wednesday morning, not at the next merge.
#
# If one click is preferred over none: this repository is PUBLIC, so GitHub
# Environments with a required reviewer are free (they are a paid feature on
# private repositories). Create an environment, add yourself as a reviewer, and
# add `environment: <name>` to the job below. The push then waits for approval.
name: Database

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-push.yml'
      - 'apps/web/scripts/assets-check.mjs'
  # 05:17 UTC — after a working day of /maintenance edits, before the next.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Never two pushes at once, and never cancel one half-done: a migration that is
# applied but not recorded is the one state rule 4 cannot talk its way out of.
concurrency:
  group: db-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: Push migrations and check the assets on hosted
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Not a secret: it is half of every public URL this project serves.
      PROJECT_REF: xliwtiiopwyfunxkdmxh
    steps:
      - name: Are the secrets present?
        id: armed
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Not armed::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to enable automatic migration push. Until then migrations must be pushed by hand with 'pnpm db:sync' from a clean main."
          fi

      - uses: actions/checkout@v4
        if: steps.armed.outputs.armed == 'true'

      # ── PINNED, AND NOT FOR TIDINESS ──────────────────────────────────────
      # `version: latest` makes this action ask the GitHub API which release is
      # newest, on every run. On 2026-10-15 two dispatches sixteen seconds apart
      # both died there:
      #
      #   Failed to resolve latest Supabase CLI release: rate limit exceeded
      #
      # Before `link`, before `push` — so the job failed without touching the
      # database and WITHOUT SAYING ANYTHING ABOUT THE CREDENTIALS, which is the
      # expensive part: the two failures looked exactly like the password
      # failures of the day before and were a different fault entirely.
      #
      # A pin removes the lookup, so the step cannot fail for a reason that has
      # nothing to do with this repository. It also makes CI run the CLI that
      # pushes the migrations the same CLI a person ran `supabase db reset` with
      # locally — 2.117.0 on Ben's machine today. Moving it is a deliberate act,
      # like `wrangler.jsonc`'s `compatibility_date`.
      - uses: supabase/setup-cli@v1
        if: steps.armed.outputs.armed == 'true'
        with:
          version: 2.117.0

      - name: Link the project
        if: steps.armed.outputs.armed == 'true' && github.event_name != 'schedule'
        run: supabase link --project-ref "$PROJECT_REF"

      # What is about to be applied, named before it is applied — so the log
      # answers "what did this change" without a database query.
      - name: What is pending
        if: steps.armed.outputs.armed == 'true' && github.event_name != 'schedule'
        run: supabase migration list --linked

      - name: Push
        if: steps.armed.outputs.armed == 'true' && github.event_name != 'schedule'
        run: supabase db push

      # The push reporting success is not the same as the two agreeing.
      - name: Confirm they now agree
        if: steps.armed.outputs.armed == 'true' && github.event_name != 'schedule'
        run: supabase migration list --linked

      # ── What is checked on hosted: the files, and nothing else ─────────────
      # Until 2026-11-20 this step ran `pnpm test:db` here. That suite WRITES —
      # fixtures, then hard deletes — and its `trk-98` was a real track of
      # Lucia's by then, which a run deleted. Ben's call: on hosted, check that
      # every file an exercise plays or shows is there; everything else the
      # suite asserts is a property of the migrations and is tested locally.
      # `db.support.ts` now refuses any target that is not loopback.
      - uses: pnpm/action-setup@v4
        if: steps.armed.outputs.armed == 'true'

      - uses: actions/setup-node@v4
        if: steps.armed.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.armed.outputs.armed == 'true'

      - name: Every file an exercise uses is there
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          # The access token can read the project's keys, so the one needed is
          # derived rather than stored. Masked explicitly: GitHub masks the
          # secrets it was given, NOT things computed from them at runtime.
          supabase projects api-keys --project-ref "$PROJECT_REF" --output-format json > keys.json
          eval "$(node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("keys.json", "utf8");
            const line = raw.split("\n").find((l) => l.trim().startsWith("{"));
            if (!line) { console.error("no JSON from projects api-keys"); process.exit(1); }
            const keys = JSON.parse(line).keys ?? [];
            const service = (keys.find((k) => k.name === "service_role") ?? {}).api_key;
            if (!service) { console.error("service_role key missing"); process.exit(1); }
            console.log(`echo "::add-mask::${service}"`);
            console.log(`export SUPABASE_TEST_SERVICE_ROLE_KEY=${JSON.stringify(service)}`);
          ')"
          rm -f keys.json
          export SUPABASE_TEST_URL="https://${PROJECT_REF}.supabase.co"
          pnpm assets:check
