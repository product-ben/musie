# Publish Storybook to GitHub Pages.
#
# WHY HERE AND NOT ON THE APP'S HOST. This repository is public, so Pages and
# Actions are free with no build-minute allowance to exhaust — an allowance is
# what paused the app's deploys once already. Storybook is internal
# documentation; the app is built and served by Cloudflare Workers. Keeping
# them apart also means a broken app build no longer stops the docs from
# publishing.
#
# ONE-TIME SETUP: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Storybook

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - '.github/workflows/storybook.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two deploys at once; cancel a superseded run rather than racing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:`. `packageManager` in package.json is the single source,
      # which is what ci.yml does — pinning here as well meant a pnpm bump
      # desynced the two workflows silently.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NO `pnpm check` HERE — removed 2026-10-13. It ran the whole gate a second
      # time on a commit ci.yml was already gating: runs 38352717855 and
      # 38352717823 were the same commit, the same second, 1m19s and 1m23s.
      #
      # What it added over `build:storybook` was the app's typecheck, lint and
      # the unit tests — none of which decide whether these docs are
      # publishable. The Storybook build compiles the design system itself, so a
      # type error here still fails this job. That is the gate that belongs to
      # this workflow.

      # Pages serves this repo at /musie/. Without the base path every asset
      # written as /assets/... resolves against the domain root and 404s.
      - name: Build Storybook
        run: pnpm build:storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/design-system/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
