# The emotion wheel — "I feel …"
#
# A verbatim transcription of the eight-emotion feelings wheel, English with a
# German reading beside it. Three rings, nested the way they are drawn:
#
#   emotions    8   inner ring    Happy, Trust, Fear, Surprise, Sad, …
#   detailed   40   middle ring   4 or 6 per emotion
#   specific   80   outer ring    exactly 2 per detailed feeling
#
# Order is one clockwise sweep of the wheel, starting at twelve o'clock with
# Happy, and the same sweep inside every ring. Nothing here is sorted
# alphabetically — the sequence is the picture.
#
# ── WHERE EACH FEELING SITS ───────────────────────────────────────────────
# Every node carries its position, because the wheel is a circle and the
# useful questions are about neighbours.
#
#   i     0-based index within its own ring, clockwise from twelve o'clock:
#         emotions 0–7, detailed 0–39, specific 0–79.
#   deg   [start, end] in degrees, same origin and direction. 0° is the line
#         between Anticipation and Happy at the top; the wheel closes at 360.
#
# Index and angle are not interchangeable, and assuming they are is the trap
# this file exists to prevent. A main emotion is always 45°, but it holds 4 OR
# 6 detailed feelings — so a detailed segment is 11.25° inside Trust and 7.5°
# inside Happy, and a specific is half of whatever its parent is. Equal steps
# in `i` are unequal steps in `deg`.
#
# ── NEIGHBOURS ────────────────────────────────────────────────────────────
# Neighbours wrap, because nothing on a circle is first or last:
#
#   either side of detailed d:   (d - 1) % 40   and   (d + 1) % 40
#
# Every detailed feeling holds exactly two specifics, so a specific's index is
# 2 × its parent's index, plus 0 or 1. That makes the drill-down question — a
# detailed feeling's own two specifics, plus the one touching it on each side
# from the neighbouring detailed feelings — pure arithmetic:
#
#   its own       2d  and  2d + 1
#   to its left   (2d - 1) % 80     the last specific of detailed d - 1
#   to its right  (2d + 2) % 80     the first specific of detailed d + 1
#
# Worked, for Happy › Optimistic (d = 0): its own are 0 Powerful and 1
# Inspired, to the left is 79 Passionate, to the right is 2 Proud. Passionate
# is the last word of Anticipation, and the wrap is the whole point — it is
# the segment physically touching Powerful across the twelve o'clock line.
#
# ── THE WORDS ─────────────────────────────────────────────────────────────
# The English is the image's own wording, unedited. Three consequences that are
# the source's, not this file's:
#
#   - Powerful appears twice under Happy — under Optimistic and under Strong.
#   - Delighted appears under Happy › Joyful and again under Surprise › Amazed.
#   - Embarassed is spelled with one r, as the wheel spells it.
#
# A word is therefore not a key; `i` is. The two Powerfuls are specific 0 and
# 5, the two Delighteds are 7 and 37.
#
# The wheel mixes adjectives (Happy, Scared) with nouns (Trust, Grief,
# Admiration). The German mirrors each word's part of speech instead of
# levelling it, so the prompt reads "Ich fühle mich ruhig" for an adjective and
# "Ich fühle Verachtung" for a noun. German follows docs/GERMAN-UI-WRITING.md —
# du, sentence case, no Bitte, and … rather than three dots.
#
# Nothing reads this file yet — no migration, no table, no app code. It is a
# dataset on an experiment branch.

wheel:
  zero_at: twelve o'clock
  direction: clockwise
  rings: { emotions: 8, detailed: 40, specific: 80 }

prompt:
  en: I feel …
  de: Ich fühle mich …

emotions:
