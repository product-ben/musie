          - { i: 1, deg: [3.75, 7.5],  en: Inspired, de: Inspiriert }

      - id: confident
        i: 1
        deg: [7.5, 15]
        en: Confident
        de: Selbstbewusst
        specific:
          - { i: 2, deg: [7.5, 11.25],  en: Proud,        de: Stolz        }
          - { i: 3, deg: [11.25, 15],   en: Self-Assured, de: Selbstsicher }

      - id: strong
        i: 2
        deg: [15, 22.5]
        en: Strong
        de: Stark
