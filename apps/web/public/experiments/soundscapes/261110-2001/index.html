<main class="musie-app">
  <section class="musie-scene" id="scene" aria-label="Szene">
    <canvas id="canvas" aria-hidden="true"></canvas>
    <p class="musie-scene__caption" aria-live="polite">

      <span class="musie-scene__state" id="state"></span>
    </p>
  </section>

  <div class="musie-picks">
    <p class="musie-hint">Antippen, und es klingt. Nochmal antippen nimmt es wieder weg. Ein Ort und ein Klang gehen zusammen.</p>

    <fieldset class="musie-group">
      <legend>Ort</legend>
      <div class="musie-chips" id="places"></div>
    </fieldset>
    <div class="musie-controls" id="placeControls" hidden>
      <label class="musie-slider"><span class="musie-slider__name">Bewegung</span>
        <input class="musie-range" type="range" min="0" max="100" id="motion" aria-label="Bewegung, von still bis bewegt">
          <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">still</span><span class="musie-slider__end">bewegt</span></span></label>
      <label class="musie-slider"><span class="musie-slider__name">Nähe</span>
        <input class="musie-range" type="range" min="0" max="100" id="distance" aria-label="Nähe, von nah bis fern">
          <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">nah</span><span class="musie-slider__end">fern</span></span></label>
    </div>

    <fieldset class="musie-group">
      <legend>Klang</legend>
      <div class="musie-chips" id="tones"></div>
    </fieldset>
    <div class="musie-controls musie-controls--tone" id="toneControls" hidden>
      <label class="musie-slider"><span class="musie-slider__name">Dichte</span>
        <input class="musie-range" type="range" min="0" max="100" id="density" aria-label="Dichte, von sparsam bis getragen">
          <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">sparsam</span><span class="musie-slider__end">getragen</span></span></label>
      <label class="musie-slider"><span class="musie-slider__name">Lautstärke</span>
        <input class="musie-range" type="range" min="0" max="100" id="volume" aria-label="Lautstärke des Klangs, von leise bis laut">
          <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">leise</span><span class="musie-slider__end">laut</span></span></label>
    </div>
  </div>

  <nav class="musie-bar" aria-label="Wiedergabe">
    <button class="musie-btn musie-btn--primary" id="play" type="button"></button>
    <button class="musie-btn" id="timer" type="button"></button>
    <button class="musie-btn" id="image" type="button"></button>
  </nav>

<script>
'use strict';
/* ════════ Grundlagen ════════ */
const $ = s => document.querySelector(s);
const lerp = (a, b, x) => a + (b - a) * x, clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const expo = rate => -Math.log(1 - Math.random()) / Math.max(rate, 1e-6);   // zufällige Abstände: nie ein Takt

const PLACES = [
  { id: 'strand', name: 'Strand' }, { id: 'wald', name: 'Wald' }, { id: 'regen', name: 'Regen' },
  { id: 'bach', name: 'Bach' }, { id: 'kamin', name: 'Kamin' },
];
const TONES = [
  { id: 'schale', name: 'Klangschale' }, { id: 'teppich', name: 'Klangteppich' },
  { id: 'monochord', name: 'Monochord' }, { id: 'ambient', name: 'Ambient' },
];
const TIMERS = [5, 10, 15, 30, 60, 0];          // 0 = ohne Timer
const END_FADE = 45;                             // Sekunden Ausklang am Timer-Ende
const THUNDER_CAP = 0.2;                         // fester Deckel für Donner, unabhängig von allem anderen

/* ════════ Zwischenstand ════════ */
const KEY = 'musie-soundscapes-v1';
const DEFAULTS = { place: null, tone: null, motion: 0.4, distance: 0.3, density: 0.5, volume: 0.7, timer: 15, image: true };
function load() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (j && typeof j === 'object') {
      const s = { ...DEFAULTS, ...j };
      if (!PLACES.some(p => p.id === s.place)) s.place = null;
      if (!TONES.some(p => p.id === s.tone)) s.tone = null;
      if (!TIMERS.includes(s.timer)) s.timer = 15;
      for (const k of ['motion', 'distance', 'density', 'volume']) s[k] = clamp(+s[k] || 0, 0, 1);
      s.image = s.image !== false;
      return s;
    }
  } catch (e) {}
  return { ...DEFAULTS };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const S = load();

/* ════════ Audio: Summe, Begrenzer, Hall ════════ */
let ctx = null, master, reverbIn, buf, unlocking = false;
const layers = { place: null, tone: null };
const now = () => ctx.currentTime;

function gain(v) { const g = ctx.createGain(); g.gain.value = v; return g; }
function filt(type, f, q) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function setT(param, v, t, tc) { param.setTargetAtTime(v, Math.max(t, now()), Math.max(tc, 0.005)); }
// Jede Regleränderung weich: nie ein Sprung.
function smooth(param, v, tc = 0.35) { const t = now(); param.cancelScheduledValues(t); param.setValueAtTime(param.value, t); param.setTargetAtTime(v, t, tc); }

function makeNoise(kind, seconds) {
  const sr = ctx.sampleRate, fade = Math.floor(sr * 0.5), L = Math.floor(sr * seconds), n = L + fade;
  const raw = new Float32Array(n);
  if (kind === 'white') for (let i = 0; i < n; i++) raw[i] = Math.random() * 2 - 1;
  else if (kind === 'pink') {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852;
      b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;
      raw[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .11; b6 = w * .115926;
    }
  } else { let last = 0; for (let i = 0; i < n; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; raw[i] = last; } }
  // nahtlose Schleife: der Anfang wird in das Ende überblendet
  const b = ctx.createBuffer(1, L, sr), d = b.getChannelData(0);
  for (let i = 0; i < L; i++) d[i] = raw[i];
  for (let i = 0; i < fade; i++) { const a = i / fade; d[i] = raw[i] * a + raw[L + i] * (1 - a); }
  let peak = 0; for (let i = 0; i < L; i++) peak = Math.max(peak, Math.abs(d[i]));
  const k = 0.9 / (peak || 1); for (let i = 0; i < L; i++) d[i] *= k;
  return b;
}
function makeBurst(ms, decayMs) {
  const sr = ctx.sampleRate, L = Math.floor(sr * ms / 1000), b = ctx.createBuffer(1, L, sr), d = b.getChannelData(0);
  const att = Math.floor(sr * 0.0008);   // eine knappe Millisekunde Anstieg: kein Knacken
  for (let i = 0; i < L; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * decayMs / 1000)) * Math.min(1, i / att);
  return b;
}
function makeImpulse(seconds, decay) {
  const sr = ctx.sampleRate, L = Math.floor(sr * seconds), b = ctx.createBuffer(2, L, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c); let lp = 0;
    for (let i = 0; i < L; i++) { lp += 0.35 * ((Math.random() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - i / L, decay); }
  }
  return b;
}

function initAudio() {
  if (ctx) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = gain(0);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -22; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.4;
  const limit = ctx.createDynamicsCompressor();      // Begrenzer: keine Spitze kommt durch
  limit.threshold.value = -8; limit.knee.value = 0; limit.ratio.value = 20; limit.attack.value = 0.002; limit.release.value = 0.3;
  const out = gain(1.1);
  master.connect(comp); comp.connect(limit); limit.connect(out); out.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.buffer = makeImpulse(4.5, 3);
  reverbIn = gain(1); const verbOut = gain(0.7);
  reverbIn.connect(verb); verb.connect(verbOut); verbOut.connect(master);
  buf = {
    white: [makeNoise('white', 9.3), makeNoise('white', 11.7)],
    pink: [makeNoise('pink', 10.1), makeNoise('pink', 13.3)],
    brown: [makeNoise('brown', 12.7), makeNoise('brown', 15.1)],
    drop: [0, 1, 2, 3].map(() => makeBurst(40, 6)),
    click: [0, 1, 2, 3].map(() => makeBurst(8, 1.4)),
  };
  setInterval(schedule, 200);
}
function unlockAudio() {
  if (!ctx || ctx.state === 'running' || !playing) return;
  unlocking = true;
  ctx.resume().then(() => { unlocking = false; }, () => { unlocking = false; });
  try { const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); } catch (e) {}
}
['touchend', 'pointerup', 'click', 'keydown'].forEach(t => addEventListener(t, unlockAudio, { capture: true, passive: true }));

/* Rausch-Fläche: zwei verschiedene Schleifen, links und rechts, an zufälliger Stelle begonnen */
function bed(kind, dest, g, srcs) {
  [-0.5, 0.5].forEach((pan, k) => {
    const s = ctx.createBufferSource(); s.buffer = buf[kind][k]; s.loop = true;
    const v = gain(g * 0.75); s.connect(v);
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; v.connect(p); p.connect(dest); } else v.connect(dest);
    s.start(now(), Math.random() * s.buffer.duration); srcs.push(s);
  });
}
function oneShot(b, dest, t, o) {
  const s = ctx.createBufferSource(); s.buffer = b; s.playbackRate.value = o.rate || 1;
  const f = filt(o.type || 'bandpass', o.freq, o.q || 1), v = gain(o.gain);
  s.connect(f); f.connect(v);
  if (o.pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; v.connect(p); p.connect(dest); } else v.connect(dest);
  s.start(t);
}
function panTo(node, pan, dest) {
  if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(dest); } else node.connect(dest);
}
/* Ereignisse in zufälligen Abständen (Poisson): für Tropfen, Wellen, Anschläge. Kein Raster, kein Beat. */
function stream(rateFn, fire) {
  let next = null;
  return (from, to) => {
    if (next === null || next < from) next = from + Math.random() * 0.3;
    while (next < to) { fire(next); next += Math.max(0.02, expo(rateFn())); }
  };
}

/* ════════ Grundton D ════════
   Alle Klänge und die tonhaften Teile der Orte (Wind, Bach) stehen auf D-Dur-Pentatonik: D E F♯ A H.
   Darum passt jeder Ort zu jedem Klang. */
const D2 = 73.416;
const hz = semis => D2 * Math.pow(2, semis / 12);
const PENTA = [0, 2, 4, 7, 9];
const scale = (lo, hi) => { const r = []; for (let o = 0; o < 6; o++) for (const p of PENTA) { const s = o * 12 + p; if (s >= lo && s <= hi) r.push(s); } return r; };

/* ════════ Orte ════════ */
const PLACE_ENGINES = {
  strand(out, srcs) {
    let I = S.motion;
    const lowLp = filt('lowpass', 220, .5), low = gain(.2); bed('brown', lowLp, 1, srcs); lowLp.connect(low); low.connect(out);
    const waveLp = filt('lowpass', 400, .6), wave = gain(.05); bed('pink', waveLp, 1, srcs); waveLp.connect(wave); wave.connect(out);
    const hissHp = filt('highpass', 3500, .5), hiss = gain(0); bed('white', hissHp, .5, srcs); hissHp.connect(hiss); hiss.connect(out);
    const waves = stream(() => 1 / lerp(10, 5.5, I), t => {
      const dur = lerp(9.5, 5.5, I) * rnd(.8, 1.25), rise = dur * rnd(.38, .5), peak = lerp(.28, .55, I) * rnd(.7, 1);
      setT(wave.gain, peak, t, rise / 3); setT(wave.gain, lerp(.04, .1, I), t + rise, (dur - rise) / 3);
      setT(waveLp.frequency, lerp(900, 2200, I) * rnd(.8, 1.2), t, rise / 3); setT(waveLp.frequency, 380, t + rise, (dur - rise) / 3);
      setT(hiss.gain, peak * .16, t + rise * .85, .5); setT(hiss.gain, .004, t + rise + .8, (dur - rise) / 3);
      vis('wave', t, { dur });
    });
    return { setI(i) { I = i; smooth(low.gain, lerp(.12, .3, i), .6); }, tick(a, b) { waves(a, b); } };
  },
  wald(out, srcs) {
    let I = S.motion;
    const windBp = filt('bandpass', 587, .8), wind = gain(.05); bed('pink', windBp, 1.8, srcs); windBp.connect(wind); wind.connect(out);
    const leafHp = filt('highpass', 2600, .7), leafLp = filt('lowpass', 8000, .5), leaf = gain(.02), flutter = gain(.6);
    bed('white', leafHp, .35, srcs); leafHp.connect(leafLp); leafLp.connect(leaf); leaf.connect(flutter); flutter.connect(out);
    const airLp = filt('lowpass', 180, .5), air = gain(.1); bed('brown', airLp, 1, srcs); airLp.connect(air); air.connect(out);
    const WIND = [440, 587.33, 659.26, 739.99, 880];      // A4 D5 E5 F♯5 A5
    const gusts = stream(() => 1 / lerp(10, 4, I), t => {
      const g = lerp(.12, .4, I) * rnd(.5, 1), up = rnd(1.5, 3.5), hold = rnd(1, 3);
      setT(wind.gain, g, t, up / 2); setT(windBp.frequency, pick(WIND) * rnd(.97, 1.03), t, up);
      setT(wind.gain, lerp(.03, .08, I), t + up + hold, rnd(1.5, 3));
      setT(leaf.gain, g * .45, t + .3, up / 2); setT(leaf.gain, lerp(.01, .04, I), t + up + hold * .8, rnd(1, 2));
      vis('gust', t, { g });
    });
    const rustle = stream(() => lerp(3, 9, I), t => setT(flutter.gain, rnd(.25, 1), t, .04));
    return { setI(i) { I = i; }, tick(a, b) { gusts(a, b); rustle(a, b); } };
  },
  regen(out, srcs) {
    let I = S.motion, lastThunder = -1e9;
    const bedHp = filt('highpass', 600, .5), bedLp = filt('lowpass', 9000, .5), bedG = gain(0);
    bed('pink', bedHp, 1, srcs); bedHp.connect(bedLp); bedLp.connect(bedG); bedG.connect(out);
    const bodyLp = filt('lowpass', 500, .5), body = gain(0); bed('brown', bodyLp, 1, srcs); bodyLp.connect(body); body.connect(out);
    const drops = stream(() => lerp(2, 28, I), t => {
      const level = .15 / Math.sqrt(1 + I * 6);       // mehr Tropfen, jeder leiser: dichter, nicht lauter
      oneShot(pick(buf.drop), out, t, { freq: rnd(1400, 5200), q: rnd(1.5, 5), gain: level * rnd(.3, 1), rate: rnd(.8, 1.3), pan: rnd(-.8, .8) });
    });
    // Donner: nur ganz oben auf „bewegt“, nur fern (tief gefiltert), mit festem Deckel.
    function thunder(t) {
      const s = ctx.createBufferSource(); s.buffer = buf.brown[1];
      const lp1 = filt('lowpass', 160, .5), lp2 = filt('lowpass', 110, .5), g = gain(0);
      s.connect(lp1); lp1.connect(lp2); lp2.connect(g); g.connect(out);
      const peak = Math.min(THUNDER_CAP, THUNDER_CAP * clamp((I - .7) / .3, .35, 1) * rnd(.6, 1));
      const att = rnd(1.8, 3.5), hold = rnd(1, 3), rel = rnd(5, 8);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + att);
      g.gain.linearRampToValueAtTime(peak * rnd(.6, .9), t + att + hold * .5); g.gain.linearRampToValueAtTime(peak * rnd(.7, 1), t + att + hold);
      g.gain.setTargetAtTime(0, t + att + hold, rel / 3);
      s.start(t, rnd(0, 4)); s.stop(t + att + hold + rel * 2);
    }
    return {
      setI(i) { I = i; smooth(bedG.gain, lerp(.07, .38, i), .6); smooth(body.gain, lerp(.04, .2, i), .6); smooth(bedLp.frequency, lerp(6000, 10000, i), .6); },
      tick(a, b) {
        drops(a, b);
        if (I > .7 && a - lastThunder > 25 && Math.random() < (I - .7) / .3 / 40 * (b - a)) { lastThunder = a; thunder(a + Math.random() * (b - a)); }
      },
    };
  },
  bach(out, srcs) {
    let I = S.motion;
    const baseBp = filt('bandpass', 700, .5), base = gain(.1); bed('pink', baseBp, 1, srcs); baseBp.connect(base); base.connect(out);
    const src = gain(1); bed('white', src, 1, srcs);
    const FREQ = scale(39, 72).map(hz);                  // D5 bis D7, alle auf der Pentatonik
    const bands = [0, 1, 2, 3, 4, 5].map(k => {
      const bp = filt('bandpass', pick(FREQ), rnd(8, 12)), g = gain(0); src.connect(bp); bp.connect(g); panTo(g, rnd(-.7, .7), out);
      return { bp, g, run: stream(() => lerp(4, 11, I), t => {
        const on = k < 2 + I * 4;
        setT(bp.frequency, pick(FREQ) * rnd(.985, 1.015), t, rnd(.015, .06));
        setT(g.gain, on ? rnd(.15, 1) * 4.2 / Math.sqrt(2 + I * 4) : 0, t, .03);
      }) };
    });
    return { setI(i) { I = i; smooth(base.gain, lerp(.06, .16, i), .6); }, tick(a, b) { bands.forEach(x => x.run(a, b)); } };
  },
  kamin(out, srcs) {
    let I = S.motion;
    const roarLp = filt('lowpass', 260, .7), roar = gain(.25), flick = gain(1);
    bed('brown', roarLp, 1, srcs); roarLp.connect(roar); roar.connect(flick); flick.connect(out);
    const hissBp = filt('bandpass', 2500, .6), hiss = gain(.02); bed('pink', hissBp, 1, srcs); hissBp.connect(hiss); hiss.connect(out);
    const flicker = stream(() => rnd(.7, 2), t => setT(flick.gain, rnd(.65, 1), t, .25));
    const crackles = stream(() => lerp(1.2, 8, I), t => {
      const n = 1 + Math.floor(Math.random() * 3), level = .17 / Math.sqrt(1 + I * 3);
      let tt = t;
      for (let k = 0; k < n; k++) {
        oneShot(pick(buf.click), out, tt, { freq: rnd(1200, 4500), q: rnd(.8, 2), gain: level * rnd(.3, 1), rate: rnd(.7, 1.4), pan: rnd(-.6, .6) });
        tt += rnd(.008, .05);
      }
      if (Math.random() < .06) oneShot(pick(buf.drop), out, t, { freq: rnd(400, 800), q: 1, gain: .08, rate: .5 });
      vis('spark', t);
    });
    return {
      setI(i) { I = i; smooth(roar.gain, lerp(.16, .36, i), .6); smooth(hiss.gain, lerp(.012, .035, i), .6); },
      tick(a, b) { flicker(a, b); crackles(a, b); },
    };
  },
};

/* ════════ Klänge ════════ */
const TONE_WET = { schale: .35, teppich: .25, monochord: .3, ambient: .65 };
const TONE_ENGINES = {
  schale(out, srcs) {
    let d = S.density;
    const hum = gain(0); hum.connect(out);
    [12, 19].forEach(s => { const o = ctx.createOscillator(); o.frequency.value = hz(s); const g = gain(.5); o.connect(g); g.connect(hum); o.start(); srcs.push(o); });
    const PARTIALS = [[1, 1], [2.005, .45], [3.01, .28], [4.52, .12]];     // ×3 und ×4,5 bleiben auf der Tonleiter
    const strikes = stream(() => 1 / lerp(20, 7, d), t => {
      const f = hz(pick([12, 19, 24, 26])), dec = lerp(7, 13, d) * rnd(.85, 1.15), lvl = .09 * rnd(.7, 1), pan = rnd(-.4, .4);
      PARTIALS.forEach(([r, a], k) => {
        for (const det of [-.35, .35]) {
          const o = ctx.createOscillator(); o.frequency.value = f * r + det * (1 + k);
          const e = gain(0); o.connect(e); panTo(e, pan, out);
          e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(lvl * a * .5, t + .07);
          e.gain.setTargetAtTime(0, t + .07, dec / (5 * (1 + k * .6)));
          o.start(t); o.stop(t + dec * 1.6);
        }
      });
      vis('ring', t, { dec });
    });
    return { setD(v) { d = v; smooth(hum.gain, lerp(0, .03, v), 1.5); }, tick(a, b) { strikes(a, b); } };
  },
  teppich(out, srcs) {
    let d = S.density;
    const lp = filt('lowpass', 800, .7); lp.connect(out);
    const NOTES = [0, 12, 7, 19, 16, 24];             // D2 D3 A2 A3 F♯3 D4, in der Reihenfolge, in der sie dazukommen
    const voices = NOTES.map(s => {
      const f = hz(s), vg = gain(0); vg.connect(lp);
      const a = ctx.createOscillator(); a.type = 'triangle'; a.frequency.value = f;
      const b = ctx.createOscillator(); b.type = 'sawtooth'; b.frequency.value = f; b.detune.value = rnd(-6, 6);
      const ga = gain(.06), gb = gain(.022); a.connect(ga); b.connect(gb); ga.connect(vg); gb.connect(vg);
      const lfo = ctx.createOscillator(); lfo.frequency.value = rnd(.04, .11); const lg = gain(4); lfo.connect(lg); lg.connect(b.detune);
      [a, b, lfo].forEach(o => { o.start(); srcs.push(o); });
      return vg;
    });
    const active = k => k < 3 + Math.round(d * 3);
    voices.forEach((v, k) => setT(v.gain, active(k) ? .7 : 0, now(), 2));
    const swell = stream(() => 1 / 2.5, t => { const k = Math.floor(Math.random() * voices.length); setT(voices[k].gain, active(k) ? rnd(.45, 1) : 0, t, rnd(2, 4)); });
    return {
      setD(v) { d = v; smooth(lp.frequency, lerp(500, 1300, v), 1); voices.forEach((g, k) => setT(g.gain, active(k) ? .7 : 0, now(), 2)); },
      tick(a, b) { swell(a, b); },
    };
  },
  monochord(out, srcs) {
    let d = S.density;
    const N = 32, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
    for (let n = 1; n <= N; n++) im[n] = 1 / Math.pow(n, 1.1);
    const wave = ctx.createPeriodicWave(re, im);
    const droneLp = filt('lowpass', 280, .5), drone = gain(.03); droneLp.connect(drone); drone.connect(out);
    const dOsc = ctx.createOscillator(); dOsc.setPeriodicWave(wave); dOsc.frequency.value = hz(0); dOsc.connect(droneLp); dOsc.start(); srcs.push(dOsc);
    const STRINGS = [0, 0, 7, 12, 12, 12, 19, 24];   // D2 D2 A2 D3 D3 D3 A3 D4
    function pluck(t, f, pan) {
      const o = ctx.createOscillator(); o.setPeriodicWave(wave); o.frequency.value = f;
      const lp = filt('lowpass', rnd(2500, 4000), .6), e = gain(0);
      o.connect(lp); lp.connect(e); panTo(e, pan, out);
      lp.frequency.setValueAtTime(rnd(2500, 4000), t); lp.frequency.setTargetAtTime(f * 3, t + .01, .5);
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(.045, t + .015); e.gain.setTargetAtTime(0, t + .015, lerp(1, 1.9, d));
      o.start(t); o.stop(t + 10);
    }
    const strums = stream(() => 1 / lerp(9, 3.2, d), t => {
      const n = Math.round(lerp(4, 8, d)), up = Math.random() < .5;
      let tt = t;
      for (let k = 0; k < n; k++) {
        const i = up ? k % STRINGS.length : STRINGS.length - 1 - (k % STRINGS.length);
        pluck(tt, hz(STRINGS[i]) * Math.pow(2, rnd(-3, 3) / 1200), lerp(-.5, .5, i / (STRINGS.length - 1)));
        tt += rnd(.06, .16);
      }
      vis('strum', t);
    });
    return { setD(v) { d = v; smooth(drone.gain, lerp(.02, .07, v), 1.5); }, tick(a, b) { strums(a, b); } };
  },
  ambient(out, srcs) {
    let d = S.density, last = -1;
    const root = ctx.createOscillator(); root.frequency.value = hz(12); const rg = gain(.015); root.connect(rg); rg.connect(out); root.start(); srcs.push(root);
    const NOTES = scale(12, 36);
    const tones = stream(() => 1 / lerp(6, 2.2, d), t => {
      let s; do { s = pick(NOTES); } while (s === last); last = s;
      const f = hz(s), att = rnd(3, 6), hold = rnd(1.5, 4), rel = rnd(5, 9), lvl = .045;
      const a = ctx.createOscillator(); a.frequency.value = f;
      const b = ctx.createOscillator(); b.type = 'triangle'; b.frequency.value = f * 2; const bg = gain(.2);
      const e = gain(0); a.connect(e); b.connect(bg); bg.connect(e); panTo(e, rnd(-.7, .7), out);
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(lvl, t + att); e.gain.setValueAtTime(lvl, t + att + hold);
      e.gain.setTargetAtTime(0, t + att + hold, rel / 4);
      const end = t + att + hold + rel * 1.5; a.start(t); b.start(t); a.stop(end); b.stop(end);
      vis('glow', t, { att, hold, rel });
    });
    return { setD(v) { d = v; }, tick(a, b) { tones(a, b); } };
  },
};

/* ════════ Schichten ════════ */
function makeLayer(type, kind) {
  const input = gain(1), fade = gain(0), L = { type, kind, srcs: [], h: 0 };
  input.connect(fade); L.fade = fade;
  if (type === 'place') {
    L.lp = filt('lowpass', 16000, .5); L.dry = gain(1); L.wet = gain(.1);
    fade.connect(L.lp); L.lp.connect(L.dry); L.dry.connect(master); L.lp.connect(L.wet); L.wet.connect(reverbIn);
    L.eng = PLACE_ENGINES[kind](input, L.srcs);
  } else {
    L.vol = gain(1); L.dry = gain(1); L.wet = gain(TONE_WET[kind]);
    fade.connect(L.vol); L.vol.connect(L.dry); L.dry.connect(master); L.vol.connect(L.wet); L.wet.connect(reverbIn);
    L.eng = TONE_ENGINES[kind](input, L.srcs);
  }
  applyParams(L);
  fade.gain.setTargetAtTime(1, now(), 1);     // jede neue Schicht blendet ein (etwa 3 s)
  return L;
}
function dropLayer(L) {
  L.dead = true; smooth(L.fade.gain, 0, .7);
  setTimeout(() => { L.srcs.forEach(s => { try { s.stop(); } catch (e) {} }); try { L.fade.disconnect(); } catch (e) {} }, 5000);
}
function applyParams(L) {
  if (!L) return;
  if (L.type === 'place') {
    L.eng.setI(S.motion);
    const n = S.distance;                     // fern: dumpfer und mehr Hall, nicht nur leiser
    smooth(L.lp.frequency, 16000 * Math.pow(900 / 16000, n), .4);
    smooth(L.dry.gain, lerp(1, .45, n), .4); smooth(L.wet.gain, lerp(.08, .6, n), .4);
  } else {
    L.eng.setD(S.density);
    smooth(L.vol.gain, Math.pow(S.volume, 2) * 1.3, .3);
  }
}
function syncLayers() {
  if (!ctx) return;
  for (const [type, id] of [['place', S.place], ['tone', S.tone]]) {
    const cur = layers[type];
    if (cur && cur.kind === id) continue;
    if (cur) dropLayer(cur);
    layers[type] = id ? makeLayer(type, id) : null;
  }
}
function schedule() {
  if (!ctx || ctx.state !== 'running') return;
  const to = now() + 1.5;          // Vorlauf: auch wenn der Browser im Hintergrund den Takt drosselt
  for (const L of [layers.place, layers.tone]) {
    if (!L || L.dead) continue;
    const from = Math.max(L.h, now());
    if (to > from) { L.eng.tick(from, to); L.h = to; }
  }
}

/* ════════ Wiedergabe und Timer ════════ */
let playing = false, ending = false, pauseToken = 0, endAt = null, remaining = S.timer * 60000;
function fadeMaster(target, s) {
  const g = master.gain, t = now();
  g.cancelScheduledValues(t); g.setValueAtTime(Math.max(g.value, .0001), t);
  if (target <= 0) { g.exponentialRampToValueAtTime(.0001, t + s); g.setValueAtTime(0, t + s + .01); }
  else g.exponentialRampToValueAtTime(target, t + s);
}
function play() {
  if (!S.place && !S.tone) return;
  initAudio();
  if (!playing) {
    playing = true; pauseToken++;
    ctx.resume();
    syncLayers();
    fadeMaster(1, 4);                           // Einblenden beim Start
    if (S.timer && endAt === null) endAt = Date.now() + remaining;
  }
  if (ending) { ending = false; remaining = S.timer * 60000; endAt = S.timer ? Date.now() + remaining : null; fadeMaster(1, 3); }
  render();
}
function pause(s = 1.5) {
  if (!playing) return;
  playing = false; ending = false;
  if (endAt !== null) { remaining = Math.max(0, endAt - Date.now()); endAt = null; }
  fadeMaster(0, s);
  const token = ++pauseToken;
  setTimeout(() => { if (token === pauseToken && !playing && ctx) ctx.suspend(); }, s * 1000 + 300);
  render();
}
function timerTick() {
  if (!playing || endAt === null) return;
  const left = endAt - Date.now();
  if (!ending && left <= END_FADE * 1000) { ending = true; fadeMaster(0, Math.max(3, left / 1000)); }
  if (left <= 0) { pause(.2); remaining = S.timer * 60000; }
  renderBar();
}
setInterval(timerTick, 500);

/* ════════ Szene ════════ */
const scene = $('#scene'), cv = $('#canvas'), g2 = cv.getContext('2d');
const reduceQ = matchMedia('(prefers-reduced-motion: reduce)');
let W = 0, H = 0, DPR = 1, C = {}, events = [], vI = S.motion, raf = 0, lastT = 0, seed = null;
function readColors() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  C = { a: v('--interactive-primary'), b: v('--interactive-accent'), ink: v('--on-surface-muted') };
}
function rgba(hex, a) {
  const h = hex.replace('#', ''), n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function resize() {
  const r = cv.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1);
  W = cv.width = Math.max(1, Math.round(r.width * DPR)); H = cv.height = Math.max(1, Math.round(r.height * DPR));
  reseed(); frame();
}
function reseed() {
  seed = {
    stems: Array.from({ length: 11 }, (_, k) => ({ x: (k + .5) / 11 + rnd(-.03, .03), top: rnd(.05, .4), w: rnd(2, 6), ph: rnd(0, 6.3) })),
    specks: Array.from({ length: 18 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(1.5, 3), ph: rnd(0, 6.3) })),
    drops: Array.from({ length: 180 }, () => ({ x: Math.random(), y: Math.random(), len: rnd(8, 16), v: rnd(.35, .7) })),
    dots: Array.from({ length: 36 }, (_, k) => ({ x: Math.random(), lane: k % 4, v: rnd(.6, 1.4), ph: rnd(0, 6.3) })),
    sparks: [],
  };
}
function vis(kind, t, data = {}) {
  if (!S.image || reduceQ.matches) return;
  setTimeout(() => events.push({ kind, born: performance.now() / 1000, ...data }), Math.max(0, (t - now()) * 1000));
}
const animating = () => playing && S.image && !reduceQ.matches && !document.hidden;
function loop(ms) {
  raf = 0; const t = ms / 1000, dt = Math.min(.1, t - (lastT || t)); lastT = t;
  vI += (S.motion - vI) * Math.min(1, dt * 1.5);
  draw(t, dt);
  if (animating()) raf = requestAnimationFrame(loop);
}
function kick() { if (animating() && !raf) { lastT = 0; raf = requestAnimationFrame(loop); } else if (!animating()) frame(); }
function frame() { if (!S.image || !W) return; vI = S.motion; draw(20, 0); }

function draw(t, dt) {
  g2.clearRect(0, 0, W, H);
  const P = S.place, T = S.tone, i = vI, s = DPR;
  g2.lineCap = 'round';
  if (!P && !T) {
    g2.strokeStyle = rgba(C.ink, .18); g2.lineWidth = 1.5 * s; g2.beginPath(); g2.moveTo(W * .2, H * .45); g2.lineTo(W * .8, H * .45); g2.stroke();
  }
  if (P === 'strand') {
    const swell = events.filter(e => e.kind === 'wave').reduce((m, e) => { const age = t - e.born; return Math.max(m, age < 0 ? 0 : Math.sin(Math.min(Math.PI, age / e.dur * Math.PI))); }, 0);
    for (let k = 0; k < 6; k++) {
      const y0 = H * (.28 + k * .1), amp = (3 + 12 * i) * s * (1 - k * .08) * (.6 + .6 * swell);
      g2.strokeStyle = rgba(C.a, .1 + .03 * k); g2.lineWidth = 1.5 * s; g2.beginPath();
      for (let x = 0; x <= W; x += 8 * s) { const y = y0 + amp * Math.sin(x / W * 6.3 * (1.2 + k * .15) + t * (.25 + .05 * k) + k); x ? g2.lineTo(x, y) : g2.moveTo(x, y); }
      g2.stroke();
    }
    g2.fillStyle = rgba(C.b, .08); g2.fillRect(0, H * .84, W, H * .16);
  }
  if (P === 'wald') {
    const gust = events.filter(e => e.kind === 'gust').reduce((m, e) => { const age = t - e.born; return Math.max(m, age < 0 ? 0 : e.g * Math.exp(-age / 4)); }, 0);
    for (const st of seed.stems) {
      const x = st.x * W, sway = Math.sin(t * .4 + st.ph) * (2 + 10 * i) * s * (1 + gust * 3);
      g2.strokeStyle = rgba(C.a, .16); g2.lineWidth = st.w * s; g2.beginPath(); g2.moveTo(x, H);
      g2.quadraticCurveTo(x, H * .6, x + sway, H * st.top); g2.stroke();
    }
    for (const p of seed.specks) {
      g2.fillStyle = rgba(C.b, .2); g2.beginPath();
      g2.arc(((p.x + Math.sin(t * .05 + p.ph) * .03) % 1) * W, ((p.y + Math.cos(t * .04 + p.ph) * .04) % 1) * H, p.r * s, 0, 6.3); g2.fill();
    }
  }
  if (P === 'regen') {
    const n = Math.round(15 + 160 * i);
    g2.strokeStyle = rgba(C.a, .2); g2.lineWidth = 1.2 * s; g2.beginPath();
    for (let k = 0; k < n; k++) {
      const d = seed.drops[k]; d.y += d.v * dt * (.7 + .6 * i); if (d.y > 1.05) { d.y = -.05; d.x = Math.random(); }
      const x = d.x * W, y = d.y * H, l = d.len * s; g2.moveTo(x, y); g2.lineTo(x - l * .12, y + l);
    }
    g2.stroke();
  }
  if (P === 'bach') {
    const laneY = (k, x) => H * (.3 + .13 * k) + Math.sin(x / W * 6.3 * 1.3 + t * .3 + k * 1.7) * H * .04;
    for (let k = 0; k < 4; k++) {
      g2.strokeStyle = rgba(C.a, .1); g2.lineWidth = 1.5 * s; g2.beginPath();
      for (let x = 0; x <= W; x += 8 * s) { const y = laneY(k, x); x ? g2.lineTo(x, y) : g2.moveTo(x, y); } g2.stroke();
    }
    g2.fillStyle = rgba(C.a, .26);
    for (const p of seed.dots) {
      p.x = (p.x + p.v * dt * (.03 + .09 * i)) % 1; const x = p.x * W;
      g2.beginPath(); g2.arc(x, laneY(p.lane, x) + Math.sin(t * 2 + p.ph) * 2 * s, 1.8 * s, 0, 6.3); g2.fill();
    }
  }
  if (P === 'kamin') {
    for (let k = 0; k < 3; k++) {
      const r = H * (.35 + k * .13) * (1 + .05 * Math.sin(t * .6 + k * 2)) * (.85 + .3 * i);
      const gr = g2.createRadialGradient(W / 2, H * .98, 0, W / 2, H * .98, r);
      gr.addColorStop(0, rgba(C.b, .16)); gr.addColorStop(1, rgba(C.b, 0)); g2.fillStyle = gr; g2.fillRect(0, 0, W, H);
    }
    for (const e of events) if (e.kind === 'spark' && !e.used) { e.used = 1; seed.sparks.push({ x: W / 2 + rnd(-.15, .15) * W, y: H * .9, vy: rnd(12, 30) * s, born: e.born, life: rnd(3, 5), ph: rnd(0, 6.3) }); }
    seed.sparks = seed.sparks.filter(p => t - p.born < p.life);
    for (const p of seed.sparks) {
      const age = t - p.born; p.y -= p.vy * dt;
      g2.fillStyle = rgba(C.b, .35 * (1 - age / p.life)); g2.beginPath(); g2.arc(p.x + Math.sin(t + p.ph) * 4 * s, p.y, 1.6 * s, 0, 6.3); g2.fill();
    }
  }
  // Klang: zart darüber
  if (T === 'schale') {
    for (const e of events) if (e.kind === 'ring') {
      const age = t - e.born; if (age < 0 || age > e.dec) continue;
      g2.strokeStyle = rgba(C.ink, .22 * (1 - age / e.dec)); g2.lineWidth = 1.5 * s; g2.beginPath();
      g2.arc(W / 2, H * .45, (age / e.dec) * Math.min(W, H) * .6 + 6 * s, 0, 6.3); g2.stroke();
    }
    if (reduceQ.matches) { g2.strokeStyle = rgba(C.ink, .14); g2.lineWidth = 1.5 * s; [.18, .3].forEach(r => { g2.beginPath(); g2.arc(W / 2, H * .45, Math.min(W, H) * r, 0, 6.3); g2.stroke(); }); }
  }
  if (T === 'teppich') {
    const h = H * (.16 + .08 * Math.sin(t * .15)) * (.7 + .6 * S.density), gr = g2.createLinearGradient(0, H * .45 - h, 0, H * .45 + h);
    gr.addColorStop(0, rgba(C.ink, 0)); gr.addColorStop(.5, rgba(C.ink, .06 + .06 * S.density)); gr.addColorStop(1, rgba(C.ink, 0));
    g2.fillStyle = gr; g2.fillRect(0, H * .45 - h, W, h * 2);
  }
  if (T === 'monochord') {
    const st = events.filter(e => e.kind === 'strum').reduce((m, e) => { const age = t - e.born; return Math.max(m, age < 0 ? 0 : Math.exp(-age / 2.5)); }, 0);
    for (let k = 0; k < 6; k++) {
      const y0 = H * (.2 + k * .09), amp = st * 5 * s * Math.sin(t * 5 + k);
      g2.strokeStyle = rgba(C.ink, .14); g2.lineWidth = 1 * s; g2.beginPath();
      for (let x = W * .1; x <= W * .9; x += 6 * s) { const u = (x - W * .1) / (W * .8), y = y0 + amp * Math.sin(Math.PI * u); x === W * .1 ? g2.moveTo(x, y) : g2.lineTo(x, y); }
      g2.stroke();
    }
  }
  if (T === 'ambient') {
    for (const e of events) if (e.kind === 'glow') {
      if (!e.x) { e.x = rnd(.15, .85); e.y = rnd(.15, .7); e.r = rnd(.12, .25); }
      const age = t - e.born, total = e.att + e.hold + e.rel; if (age < 0 || age > total) continue;
      const a = age < e.att ? age / e.att : age < e.att + e.hold ? 1 : Math.exp(-(age - e.att - e.hold) / (e.rel / 4));
      const r = H * e.r, gr = g2.createRadialGradient(e.x * W, e.y * H, 0, e.x * W, e.y * H, r);
      gr.addColorStop(0, rgba(C.ink, .14 * a)); gr.addColorStop(1, rgba(C.ink, 0)); g2.fillStyle = gr; g2.fillRect(0, 0, W, H);
    }
    if (reduceQ.matches) { const gr = g2.createRadialGradient(W * .6, H * .4, 0, W * .6, H * .4, H * .3); gr.addColorStop(0, rgba(C.ink, .12)); gr.addColorStop(1, rgba(C.ink, 0)); g2.fillStyle = gr; g2.fillRect(0, 0, W, H); }
  }
  const tnow = t; events = events.filter(e => tnow - e.born < 30);
}

/* ════════ Bedienung ════════ */
const ICON = {
  check: '<svg class="musy-icon musy-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  play: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>',
  pause: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>',
  timer: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>',
  eye: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
};
function chips(el, list, key, cls) {
  el.innerHTML = list.map(x => `<button type="button" class="musie-chip ${cls}" data-id="${x.id}" aria-pressed="false">${ICON.check}<span>${x.name}</span></button>`).join('');
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S[key] = S[key] === b.dataset.id ? null : b.dataset.id;
    save();
    if (!S.place && !S.tone) { syncLayers(); pause(2.5); }
    else { initAudio(); syncLayers(); play(); }
    render(); kick();
  });
}
chips($('#places'), PLACES, 'place', '');
chips($('#tones'), TONES, 'tone', 'musie-chip--tone');

for (const id of ['motion', 'distance', 'density', 'volume']) {
  const el = $('#' + id); el.value = Math.round(S[id] * 100);
  el.addEventListener('input', () => {
    S[id] = el.value / 100; save();
    applyParams(['motion', 'distance'].includes(id) ? layers.place : layers.tone);
    if (!animating()) frame();
  });
}
$('#play').addEventListener('click', () => { playing ? pause() : play(); kick(); });
$('#timer').addEventListener('click', () => {
  S.timer = TIMERS[(TIMERS.indexOf(S.timer) + 1) % TIMERS.length]; save();
  remaining = S.timer * 60000; endAt = playing && S.timer ? Date.now() + remaining : null;
  if (ending) { ending = false; fadeMaster(1, 3); }
  renderBar();
});
$('#image').addEventListener('click', () => { S.image = !S.image; save(); render(); if (S.image) { requestAnimationFrame(resize); } kick(); });

function fmt(ms) { const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; }
function renderBar() {
  const pb = $('#play'), has = !!(S.place || S.tone);
  pb.disabled = !has && !playing;
  pb.innerHTML = playing ? `${ICON.pause}<span>Pause</span>` : `${ICON.play}<span>Abspielen</span>`;
  const tb = $('#timer');
  let label, name;
  if (!S.timer) { label = 'Ohne Timer'; name = 'Timer aus. Tippen, um einen Timer zu wählen.'; }
  else if (ending) { label = 'Klingt aus'; name = 'Klingt aus. Tippen, um den Timer zu ändern.'; }
  else if (playing && endAt) { label = `Noch ${fmt(endAt - Date.now())}`; name = `Timer ${S.timer} Minuten, ${label.toLowerCase()}. Tippen, um ihn zu ändern.`; }
  else { label = `${S.timer} min`; name = `Timer ${S.timer} Minuten. Tippen, um ihn zu ändern.`; }
  tb.innerHTML = `${ICON.timer}<span>${label}</span>`; tb.setAttribute('aria-label', name);
  const ib = $('#image');
  ib.innerHTML = S.image ? `${ICON.eye}<span>Bild an</span>` : `${ICON.eyeOff}<span>Bild aus</span>`;
  ib.setAttribute('aria-pressed', String(S.image)); ib.setAttribute('aria-label', 'Bild');
}
function render() {
  document.querySelectorAll('#places .musie-chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === S.place)));
  document.querySelectorAll('#tones .musie-chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === S.tone)));
  $('#placeControls').hidden = !S.place; $('#toneControls').hidden = !S.tone;
  const names = [PLACES.find(p => p.id === S.place), TONES.find(p => p.id === S.tone)].filter(Boolean).map(x => x.name);
  $('#title').textContent = names.length ? names.join(' · ') : 'Noch still';
  $('#state').textContent = !names.length ? 'Wähle unten einen Ort, einen Klang oder beides.' : ending ? 'klingt aus' : playing ? 'klingt' : 'pausiert';
  scene.classList.toggle('musie-scene--off', !S.image);
  renderBar();
}

readColors(); reseed();     // Formen der Szene gleich beim Öffnen anlegen, nicht erst nach der ersten Größenmeldung
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); frame(); });
reduceQ.addEventListener('change', kick);
document.addEventListener('visibilitychange', kick);
new ResizeObserver(resize).observe(cv);
render();
</script>
</body>
</html>
