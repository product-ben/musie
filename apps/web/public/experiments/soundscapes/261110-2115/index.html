<title>Musie · Klangorte</title>
<!-- Musie-Experiment „Soundscapes v4“ (CLAUDE.md Regel 10). Prototyp zum Anschauen und Anhören.
     v4 nach Lucias Kritik an v3 („kaum Unterschied still/bewegt“, „fern ist nicht unbedingt dumpf“, „Instrumente nicht schön,
     nicht authentisch“, „Ambient ist anders“, Idee: entspannter Beat mit BPM):
     - Orte: jede Variante ist ein PAAR echter Aufnahmen, eine ruhige und eine lebhafte. „still ↔ bewegt“ blendet zwischen beiden.
     - „nah ↔ fern“ nach den Entfernungsmerkmalen der Hörforschung: Pegel, weichere Anschläge (Direktanteil sinkt),
       schmaleres Klangbild, Höhen nur leicht zurück. Kein Hall, nichts dazu.
     - Klänge: echte Aufnahmen (Klangschalen, Shruti-Box, Tanpura, Monochord, Ambient-Flächen), auf D gestimmt.
     - Neu: dritte Reihe „Rhythmus“ aus echten Schlägen (VCSL, CC0): Cajon, Rahmentrommel, Shaker. Tempo 60–90 BPM.
     ⚠ Monochord ist CC BY 4.0 (Jagadamba): Namensnennung ist Pflicht. Steht unter dem Umschalter und in ../AUDIO_LICENSES.md („Für Ben“).
     Öffnen nur über einen Server, nicht per Doppelklick. Kein PostHog, nichts an Supabase.
     Farben/Schriften: musy-foundations.css, je Theme aufgelöst. -->

<body>
<main class="musie-app">

      <label class="musie-slider"><span class="musie-slider__name">Dichte</span>
        <input class="musie-range" type="range" min="0" max="100" id="density" aria-label="Dichte, von sparsam bis getragen">
        <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">sparsam</span><span class="musie-slider__end">getragen</span></span></label>
      <label class="musie-slider"><span class="musie-slider__name">Lautstärke</span>
        <input class="musie-range" type="range" min="0" max="100" id="volume" aria-label="Lautstärke des Klangs, von leise bis laut">
        <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">leise</span><span class="musie-slider__end">laut</span></span></label>
    </div>

      <p class="musie-source" id="rhythmSource"></p>
      <label class="musie-slider"><span class="musie-slider__name">Tempo <span class="musie-slider__value" id="bpmValue"></span></span>
        <input class="musie-range" type="range" min="60" max="90" step="1" id="bpm" aria-label="Tempo in Schlägen pro Minute">
        <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">langsam</span><span class="musie-slider__end">zügiger</span></span></label>
      <label class="musie-slider"><span class="musie-slider__name">Lautstärke</span>
        <input class="musie-range" type="range" min="0" max="100" id="rvolume" aria-label="Lautstärke des Rhythmus, von leise bis laut">
        <span class="musie-slider__ends" aria-hidden="true"><span class="musie-slider__end">leise</span><span class="musie-slider__end">laut</span></span></label>
    </div>
  </div>

  <nav class="musie-bar" aria-label="Wiedergabe">
    <button class="musie-btn musie-btn--primary" id="play" type="button"></button>
    <button class="musie-btn" id="timer" type="button"></button>
    <button class="musie-btn" id="image" type="button"></button>
  </nav>
</main>

<script>
'use strict';
/* ════════ Grundlagen ════════ */
const $ = s => document.querySelector(s);
const lerp = (a, b, x) => a + (b - a) * x, clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const expo = rate => -Math.log(1 - Math.random()) / Math.max(rate, 1e-6);
const TIMERS = [5, 10, 15, 30, 60, 0];
const END_FADE = 45;

    [[-.1, .05], [.1, -.05]].forEach(([dx, rot]) => { g2.save(); g2.translate(W * (.5 + dx), H * .88); g2.rotate(rot); g2.beginPath(); g2.ellipse(0, 0, W * .22, H * .045, 0, 0, 6.3); g2.fill(); g2.restore(); });
    if (dt && Math.random() < dt * (2 + 10 * i)) seed.embers.push({ x: W / 2 + rnd(-.15, .15) * W, y: base, vy: rnd(20, 45) * s, born: t, life: rnd(2, 3.5), ph: rnd(0, 6.3) });
    seed.embers = seed.embers.filter(p => t - p.born < p.life).slice(-80);
    for (const p of seed.embers) { const a = 1 - (t - p.born) / p.life; p.y -= p.vy * dt; g2.fillStyle = rgba(c.ember, .9 * a); g2.beginPath(); g2.arc(p.x + Math.sin(t * 2 + p.ph) * 6 * s, p.y, 2 * s, 0, 6.3); g2.fill(); }
  }
  const tc = C.tone;
  if (T === 'schale') {
    for (const e of events) if (e.kind === 'ring') { const age = t - e.born; if (age < 0 || age > e.dec) continue;
      g2.strokeStyle = rgba(tc, .6 * (1 - age / e.dec)); g2.lineWidth = 2.5 * s; g2.beginPath(); g2.arc(W / 2, H * .42, (age / e.dec) * Math.max(W, H) * .55 + 8 * s, 0, 6.3); g2.stroke(); }
    if (reduceQ.matches) { g2.strokeStyle = rgba(tc, .45); g2.lineWidth = 2 * s; [.15, .27].forEach(r => { g2.beginPath(); g2.arc(W / 2, H * .42, Math.min(W, H) * r, 0, 6.3); g2.stroke(); }); }
  }
  if (T === 'teppich') for (let k = 0; k < 3; k++) {
    const y = H * (.3 + k * .15) + Math.sin(t * .12 + k * 2) * H * .05, h = H * (.06 + .04 * Math.sin(t * .2 + k)) * (.7 + .6 * S.density);
    const g = g2.createLinearGradient(0, y - h, 0, y + h); g.addColorStop(0, rgba(tc, 0)); g.addColorStop(.5, rgba(tc, .22 + .15 * S.density)); g.addColorStop(1, rgba(tc, 0));
    g2.fillStyle = g; g2.fillRect(0, y - h, W, h * 2);
  }
  if (T === 'monochord') {
    let st = 0; for (const e of events) if (e.kind === 'strum') { const age = t - e.born; if (age > 0) st = Math.max(st, Math.exp(-age / 2.5)); }
    for (let k = 0; k < 6; k++) {
      const y0 = H * (.16 + k * .08), amp = st * 9 * s * Math.sin(t * 7 + k * 1.1);
      g2.strokeStyle = rgba(tc, .55); g2.lineWidth = 1.6 * s; g2.beginPath();
      for (let x = W * .08; x <= W * .92 + 1; x += 6 * s) { const u = (x - W * .08) / (W * .84), y = y0 + amp * Math.sin(Math.PI * u); x <= W * .08 ? g2.moveTo(x, y) : g2.lineTo(x, y); }
      g2.stroke();
    }
  }
  if (T === 'ambient') {
    for (const e of events) if (e.kind === 'glow') {
      if (e.x === undefined) { e.x = rnd(.15, .85); e.y = rnd(.15, .6); e.r = rnd(.18, .3); }
      const age = t - e.born, total = e.att + e.hold + e.rel; if (age < 0 || age > total) continue;
      const a = age < e.att ? age / e.att : age < e.att + e.hold ? 1 : Math.exp(-(age - e.att - e.hold) / (e.rel / 4));
      softDot(e.x * W, e.y * H, e.r * H, tc, .5 * a);
    }
    if (reduceQ.matches) softDot(W * .6, H * .38, H * .3, tc, .4);
  }
  if (S.rhythm) {      // Rhythmus: ein ruhiger Puls unten links
    for (const e of events) if (e.kind === 'pulse') { const age = t - e.born; if (age < 0 || age > 1.2) continue;
      g2.strokeStyle = rgba(C.beat, .7 * (1 - age / 1.2) * e.g); g2.lineWidth = 2 * s; g2.beginPath(); g2.arc(W * .88, H * .18, (6 + age * 30) * s, 0, 6.3); g2.stroke(); }
    g2.fillStyle = rgba(C.beat, .8); g2.beginPath(); g2.arc(W * .88, H * .18, 4 * s, 0, 6.3); g2.fill();
  }
  if (dt) events = events.filter(e => t - e.born < 30);
}

/* ════════ Bedienung ════════ */
const ICON = {
  check: '<svg class="musy-icon musy-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  play: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>',
  pause: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>',
  timer: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>',
  eye: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg class="musy-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
};
const chipHtml = (attr, val, name, cls) => `<button type="button" class="musie-chip ${cls}" ${attr}="${val}" aria-pressed="false">${ICON.check}<span>${name}</span></button>`;
function after() { save(); if (!anything()) { syncLayers(); pause(2.5); } else { initAudio(); syncLayers(); play(); } render(); kick(); }
function chipRow(el, list, key, cls) {
  el.innerHTML = list.map(x => chipHtml('data-id', x.id, x.name, cls)).join('');
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S[key] = S[key] === b.dataset.id ? null : b.dataset.id; after(); });
}
chipRow($('#places'), PLACES, 'place', '');
chipRow($('#tones'), TONES, 'tone', 'musie-chip--accent');
chipRow($('#rhythms'), RHYTHMS, 'rhythm', 'musie-chip--accent');
$('#placeVariants').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !S.place) return; S.pv[S.place] = +b.dataset.v; after(); });
$('#toneVariants').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !S.tone) return; S.tv[S.tone] = +b.dataset.v; after(); });

for (const id of ['motion', 'distance', 'density', 'volume', 'rvolume']) {
  const el = $('#' + id); el.value = Math.round(S[id] * 100);
  el.addEventListener('input', () => {
    S[id] = el.value / 100; save();
    applyParams(['motion', 'distance'].includes(id) ? layers.place : id === 'rvolume' ? layers.rhythm : layers.tone);
    if (!animating()) frame();
  });
}
{ const el = $('#bpm'); el.value = S.bpm; el.addEventListener('input', () => { S.bpm = +el.value; save(); renderBpm(); }); }
function renderBpm() { $('#bpmValue').textContent = `${S.bpm} BPM`; $('#bpm').setAttribute('aria-valuetext', `${S.bpm} Schläge pro Minute`); }

$('#play').addEventListener('click', () => { playing ? pause() : play(); kick(); });
$('#timer').addEventListener('click', () => {
  S.timer = TIMERS[(TIMERS.indexOf(S.timer) + 1) % TIMERS.length]; save();
  remaining = S.timer * 60000; endAt = playing && S.timer ? Date.now() + remaining : null;
  if (ending) { ending = false; fadeMaster(1, 3); }
  renderBar();
});
$('#image').addEventListener('click', () => { S.image = !S.image; save(); render(); if (S.image) requestAnimationFrame(resize); kick(); });

function fmt(ms) { const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; }
function renderBar() {
  const pb = $('#play');
  pb.disabled = !anything() && !playing;
  pb.innerHTML = playing ? `${ICON.pause}<span>Pause</span>` : `${ICON.play}<span>Abspielen</span>`;
  const tb = $('#timer'); let label, name;
  if (!S.timer) { label = 'Ohne Timer'; name = 'Timer aus. Tippen, um einen Timer zu wählen.'; }
  else if (ending) { label = 'Klingt aus'; name = 'Klingt aus. Tippen, um den Timer zu ändern.'; }
  else if (playing && endAt) { label = `Noch ${fmt(endAt - Date.now())}`; name = `Timer ${S.timer} Minuten, ${label.toLowerCase()}. Tippen, um ihn zu ändern.`; }
  else { label = `${S.timer} min`; name = `Timer ${S.timer} Minuten. Tippen, um ihn zu ändern.`; }
  tb.innerHTML = `${ICON.timer}<span>${label}</span>`; tb.setAttribute('aria-label', name);
  const ib = $('#image');
  ib.innerHTML = S.image ? `${ICON.eye}<span>Bild an</span>` : `${ICON.eyeOff}<span>Bild aus</span>`;
  ib.setAttribute('aria-pressed', String(S.image)); ib.setAttribute('aria-label', 'Bild');
}
function credit(files) {
  return files.map(f => { const r = SRC[f]; const lic = r.lic || 'CC0';
    return `<a href="${r.url}" target="_blank" rel="noopener">„${r.t}“</a> von ${r.by} · ${lic === 'CC0' ? 'CC0' : `<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">${lic}</a>`}`; });
}
function variants(el, list, cur, cls) {
  const key = list.map(v => v.name).join('|');
  if (el.dataset.key !== key) { el.dataset.key = key; el.innerHTML = list.map((v, k) => chipHtml('data-v', k, v.name, cls)).join(''); }
  el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === cur)));
  el.hidden = list.length < 2;      // nur die Knöpfe; die Quellenangabe bleibt immer sichtbar (bei CC BY Pflicht)
}
function render() {
  for (const [row, key] of [['#places', 'place'], ['#tones', 'tone'], ['#rhythms', 'rhythm']])
    document.querySelectorAll(row + ' .musie-chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === S[key])));
  $('#placeControls').hidden = !S.place; $('#toneControls').hidden = !S.tone; $('#rhythmControls').hidden = !S.rhythm;
  if (S.place) {
    const p = placeOf(S.place), v = p.v[pVar(S.place)];
    variants($('#placeVariants'), p.v, pVar(S.place), '');
    $('#placeSource').innerHTML = `Ruhig: ${credit([v.calm])[0]}<br>Bewegt: ${credit([v.live])[0]}`;
  }
  if (S.tone) {
    const tn = toneOf(S.tone), v = tn.v[tVar(S.tone)];
    variants($('#toneVariants'), tn.v, tVar(S.tone), 'musie-chip--accent');
    const by = v.files.some(f => SRC[f].lic);
    $('#toneSource').innerHTML = by
      ? `Aufnahmen: <a href="${FS}Jagadamba/packs/15563/" target="_blank" rel="noopener">„Monochord 01–05“</a> von Jagadamba · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> (auf D gestimmt)`
      : `Aufnahme: ${credit(v.files).join(', ')}${v.files.some(f => f in TUNE || f in AUTO) ? ' (auf D gestimmt)' : ''}`;
  }
  $('#rhythmSource').innerHTML = BEAT_SRC;
  renderBpm();
  const names = [placeOf(S.place), toneOf(S.tone), RHYTHMS.find(r => r.id === S.rhythm)].filter(Boolean).map(x => x.name);
  $('#title').textContent = names.length ? names.join(' · ') : 'Noch still';
  const loading = playing && Object.values(layers).some(L => L && !L.dead && !L.ready);
  $('#state').textContent = !names.length ? 'Wähle unten einen Ort, einen Klang, einen Rhythmus oder mehreres.'
    : loadFailed ? 'Eine Aufnahme lädt nicht. Öffne die Seite über den Server, nicht per Doppelklick.'
    : ending ? 'klingt aus' : loading ? 'Aufnahme lädt …' : playing ? 'klingt' : 'pausiert';
  scene.classList.toggle('musie-scene--off', !S.image);
  renderBar();
}

reseed();
darkQ.addEventListener('change', frame);
reduceQ.addEventListener('change', kick);
document.addEventListener('visibilitychange', kick);
new ResizeObserver(resize).observe(cv);
render();
</script>
</body>
</html>
