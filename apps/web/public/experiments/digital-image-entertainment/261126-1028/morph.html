<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Musie · Morphen</title>
<!-- Musie-Experiment „Mit dem Bild spielen“ (siehe index.html). Morphen (vorher „Weich“): das Bild gibt
     nach wie ein weiches Material und findet von selbst in seine Form zurück. Ein Verschiebungsfeld auf
     der CPU, am Rahmen festgehalten. Aus „Weiches Bild“ 261126-0948 herausgelöst. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Literata:opsz,wght@7..72,400&display=swap">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header>
  <h1>Verform das Bild, während du zuhörst.</h1>
  <p class="hint">Das Bild ist weich. Schieb es mit dem Finger – es findet von selbst zurück.</p>
</header>
<main id="stage"></main>
<footer>
  <button id="play" class="primary" type="button"></button>
  <span id="time" class="time">0:00</span>
  <button id="next" type="button">Andere Karte</button>
</footer>
<script src="shell.js"></script>
<script src="gl.js"></script>
<script>
const CELL = 8;
const RADIUS = 0.22;      // Reichweite des Fingers, Anteil der kürzeren Bildseite
const RELAX_FREE = 1.2;   // Zeitkonstante in Sekunden, losgelassen
const RELAX_HELD = 8;     // dasselbe, solange ein Finger liegt
const STRETCH_LIGHT = 0.12;

const FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
${PICTURE_GLSL}
uniform sampler2D uField;
uniform vec2 uTexel;
uniform float uStretch;
void main() {
  // Am Rahmen festgehalten wie ein gespanntes Tuch: sonst zieht der Finger den Rand vom Bild weg.
  float edge = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
  float pin = smoothstep(0.0, 0.06, edge);
  vec2 d = texture(uField, vUv).rg * pin;
  vec3 c = picture(vUv - d);
  float dl = texture(uField, vUv - vec2(uTexel.x, 0.0)).r;
  float dr = texture(uField, vUv + vec2(uTexel.x, 0.0)).r;
  float du = texture(uField, vUv - vec2(0.0, uTexel.y)).g;
  float dd = texture(uField, vUv + vec2(0.0, uTexel.y)).g;
  float stretch = ((dr - dl) / (2.0 * uTexel.x) + (dd - du) / (2.0 * uTexel.y)) * pin; // > 0 gedehnt
  outColor = vec4(c * (1.0 + clamp(stretch, -1.0, 1.0) * uStretch), 1.0);
}`;

const canvas = document.createElement('canvas');
stage.append(canvas);
const gl = glContext(canvas);
let prog;
let quad;
let imgTex;
let fieldTex;
if (gl) {
  prog = glProgram(gl, FS);
  quad = glQuad(gl);
  imgTex = glTexture(gl);
  fieldTex = glTexture(gl);
}

let g = null;
let fw = 0;
let fh = 0;
let disp;
let scratch;
const fingers = new Map();

function sample(u, v) {
  const fx = clamp(u * fw - 0.5, 0, fw - 1);
  const fy = clamp(v * fh - 0.5, 0, fh - 1);
  const x0 = Math.floor(fx);
  const y0 = Math.floor(fy);
  const x1 = Math.min(fw - 1, x0 + 1);
  const y1 = Math.min(fh - 1, y0 + 1);
  const tx = fx - x0;
  const ty = fy - y0;
  const out = [0, 0];
  for (let k = 0; k < 2; k++) {
    const a = scratch[(y0 * fw + x0) * 2 + k];
    const b = scratch[(y0 * fw + x1) * 2 + k];
    const c = scratch[(y1 * fw + x0) * 2 + k];
    const d = scratch[(y1 * fw + x1) * 2 + k];
    out[k] = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  }
  return out;
}

/* Vorwärts-Verformung: nach dem Schieben zeigt der Punkt unter dem Finger genau das, was vorher
   dort lag, wo der Finger war. D'(x) = δ·w(x) + D(x − δ·w(x)). */
function push(x0, y0, x1, y1) {
  const du = (x1 - x0) / g.cssW;
  const dv = (y1 - y0) / g.cssH;
  if (du === 0 && dv === 0) return;
  const rad = RADIUS * Math.min(g.cssW, g.cssH);
  const sig2 = 2 * (rad / 2) ** 2;
  scratch.set(disp);
  const cx0 = Math.max(0, Math.floor(((x1 - rad) / g.cssW) * fw));
  const cx1 = Math.min(fw - 1, Math.ceil(((x1 + rad) / g.cssW) * fw));
  const cy0 = Math.max(0, Math.floor(((y1 - rad) / g.cssH) * fh));
  const cy1 = Math.min(fh - 1, Math.ceil(((y1 + rad) / g.cssH) * fh));
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      const u = (cx + 0.5) / fw;
      const v = (cy + 0.5) / fh;
      const d2 = (u * g.cssW - x1) ** 2 + (v * g.cssH - y1) ** 2;
      if (d2 > rad * rad) continue;
      const w = Math.exp(-d2 / sig2);
      const [ox, oy] = sample(u - du * w, v - dv * w);
      const i = (cy * fw + cx) * 2;
      disp[i] = du * w + ox;
      disp[i + 1] = dv * w + oy;
    }
  }
}

const effect = {
  setImage(im) {
    if (!gl) return;
    g = fit(im);
    glFit(gl, canvas, im, g, prog);
    glImage(gl, imgTex, im);
    fw = Math.max(8, Math.round(g.cssW / CELL));
    fh = Math.max(8, Math.round(g.cssH / CELL));
    disp = new Float32Array(fw * fh * 2);
    scratch = new Float32Array(fw * fh * 2);
    glFieldRG(gl, fieldTex, fw, fh, disp);
    gl.uniform2f(prog.u('uTexel'), 1 / fw, 1 / fh);
    gl.uniform1f(prog.u('uStretch'), STRETCH_LIGHT);
    fingers.clear();
  },
};

track(canvas, {
  down(id, x, y) { fingers.set(id, { x, y }); },
  move(id, x, y) {
    const f = fingers.get(id);
    if (!f || !disp) return;
    push(f.x, f.y, x, y);
    f.x = x;
    f.y = y;
  },
  up(id) { fingers.delete(id); },
});

if (gl) {
  loop((dt) => {
    if (!disp) return;
    const k = Math.exp(-dt / (fingers.size ? RELAX_HELD : RELAX_FREE));
    for (let i = 0; i < disp.length; i++) disp[i] *= k;
    gl.useProgram(prog);
    glUpdateRG(gl, fieldTex, fw, fh, disp);
    glBind(gl, prog, 'uImg', 0, imgTex);
    glBind(gl, prog, 'uField', 1, fieldTex);
    quad.draw();
  });
}

boot(effect);
</script>
</body>
</html>
