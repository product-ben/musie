# Netlify config for the STORYBOOK site.
#
# This is a SECOND Netlify site, separate from the one that deploys the web
# app. The root netlify.toml is untouched and still publishes apps/web/dist.
#
# HOW TO CONNECT IT
#   1. Netlify > Add new project > Import an existing project
#   2. Pick product-ben/musie, branch main
#   3. Site configuration > Build & deploy > **Base directory: packages/design-system**
#
# Step 3 is the load-bearing one. Netlify reads netlify.toml from the BASE
# DIRECTORY, so two sites on one repository can only have different configs by
# having different bases. Leave the base empty and this file is never read —
# the site builds the web app instead, because it falls back to the root
# netlify.toml.
#
# WHY THE BUILD COMMAND LEAVES THE BASE DIRECTORY
# pnpm workspaces keep the lockfile at the repository root, and this package
# depends on the workspace for React, base-ui and Storybook. Installing from
# packages/design-system alone resolves nothing, so the command walks back to
# the root, installs the whole workspace against the committed lockfile, and
# then builds only this package. `publish` stays relative to the base.

[build]
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @musie/design-system build-storybook"
  publish = "storybook-static"

[build.environment]
  NODE_VERSION = "22"

# Storybook is a single-page app: /?path=/docs/components-icon--docs is routed
# client-side, and deep links 404 without this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The published docs are a work in progress carrying review scaffolding
# ("Build notes" blocks, 118 open questions). Keep them out of search results
# until that scaffolding is deleted.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
